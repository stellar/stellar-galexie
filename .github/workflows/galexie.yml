name: Galexie

on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'galexie-v[0-9]+.[0-9]+.[0-9]+'
      - 'galexie-v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+'
  pull_request:
  workflow_dispatch:

env:
  # this is the version of core to be bundled with galaxie on image
  STELLAR_CORE_VERSION: 30.0.0-3642.0e49751aa.noble

jobs:
  integration-test:
    name: Run tests - ${{ matrix.storage_type }} integration
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        storage_type: [ GCS, S3, Filesystem ]
    env:
      CAPTIVE_CORE_DEBIAN_PKG_VERSION: 30.0.0-3642.0e49751aa.noble
      GALEXIE_INTEGRATION_TESTS_ENABLED: "true"
      GALEXIE_INTEGRATION_TESTS_CAPTIVE_CORE_BIN: /usr/bin/stellar-core
      # Immutable build tag of quickstart's latest track (core v30.0.0). It only runs the
      # standalone network the captive core above joins, so its core does not have to match.
      GALEXIE_INTEGRATION_TESTS_QUICKSTART_IMAGE: stellar/quickstart:v682-b1552.1-latest
      GALEXIE_INTEGRATION_TESTS_QUICKSTART_IMAGE_PULL: "false"
      GALEXIE_INTEGRATION_TESTS_QUICKSTART_PROTOCOL_VERSION: "30"
      GALEXIE_INTEGRATION_TESTS_LOCALSTACK_IMAGE_TAG: "4.6.0"
      GALEXIE_INTEGRATION_TESTS_LOCALSTACK_IMAGE_PULL: "false"
    steps:
      - name: Install captive core
        run: |
          sudo wget -qO - https://apt.stellar.org/SDF.asc | APT_KEY_DONT_WARN_ON_DANGEROUS_USAGE=true sudo apt-key add -
          sudo bash -c 'echo "deb https://apt.stellar.org noble unstable" > /etc/apt/sources.list.d/SDF-unstable.list'
          sudo apt-get update && sudo apt-get install -y stellar-core="$CAPTIVE_CORE_DEBIAN_PKG_VERSION"
          echo "Using stellar core version $(stellar-core version)"
      - name: Pull Quickstart image
        shell: bash
        run: docker pull "$GALEXIE_INTEGRATION_TESTS_QUICKSTART_IMAGE"
      - name: Pull LocalStack image (for S3)
        if: ${{ matrix.storage_type == 'S3' }}
        shell: bash
        run: docker pull localstack/localstack:${GALEXIE_INTEGRATION_TESTS_LOCALSTACK_IMAGE_TAG}
      - uses: actions/checkout@v5
        with:
          # For pull requests, build and test the PR head not a merge of the PR with the destination.
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - name: Run tests - ${{ matrix.storage_type }} integration
        run: go test -v -race -run "TestGalexie${{ matrix.storage_type }}TestSuite" ./test/...

  publish-sha-tag-image:
    name: Push sha tag container image
    needs: integration-test
    if: ${{ github.repository == 'stellar/stellar-galexie' && github.event_name == 'push' && github.ref_type != 'tag' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build docker
        run: make docker-build
      - name: Push sha tag image to DockerHub
        run: make docker-push

  publish-release-tag-image:
    name: Push release tag container image
    needs: integration-test
    # This repo publishes a release when its tag is pushed. A private clone publishes
    # one only when this workflow is run by hand on the tag, so tags synced into it
    # publish nothing.
    if: >-
      startsWith(github.ref, 'refs/tags/galexie-v') && (
        (github.repository == 'stellar/stellar-galexie' && github.event_name == 'push') ||
        (github.repository != 'stellar/stellar-galexie' && github.event_name == 'workflow_dispatch'))
    # A private clone keeps its Docker Hub secrets in this environment, limited to
    # galexie-v* tags, so older versions of this workflow cannot publish from it.
    environment: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Set RELEASE_VERSION
        run: |
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#galexie-v}" >> $GITHUB_ENV
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Check whether the release is already published
        id: published
        # A release made in a private clone keeps its image when its tag reaches this repo.
        run: |
          if docker manifest inspect "stellar/stellar-galexie:${RELEASE_VERSION}" > /dev/null 2>&1; then
            echo "::notice::stellar/stellar-galexie:${RELEASE_VERSION} is already published, so this run pushes nothing."
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Pull git sha tag image
        if: steps.published.outputs.done != 'true' && github.repository == 'stellar/stellar-galexie'
        run: make docker-pull
      - name: Build docker
        # Private clones push no sha tag images, so they build the image from the tag.
        if: steps.published.outputs.done != 'true' && github.repository != 'stellar/stellar-galexie'
        run: make docker-build
      - name: Push release tag image
        if: steps.published.outputs.done != 'true'
        run: make docker-push-release
      - name: Push latest tag to DockerHub
        if: steps.published.outputs.done != 'true' && !contains(github.ref, '-rc')
        run: make docker-push-latest
  
  complete:
    if: always()
    needs: [integration-test]
    runs-on: ubuntu-24.04
    steps:
    - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: exit 1
