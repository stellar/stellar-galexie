name: govulncheck

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'galexie-v*'
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/internal-go-modules
        with:
          client-id: ${{ secrets.INTERNAL_GO_MODULES_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.INTERNAL_GO_MODULES_GH_APP_PRIVATE_KEY }}
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          # The action's default go-version-input, "stable", would override go-version-file.
          go-version-input: ""
          go-version-file: go.mod
          go-package: ./...
          repo-checkout: false
